<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Fale com a corretora. Preencha seus dados e continue direto no WhatsApp.">
<title>Contato · Corretora de Milhões</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<main>
<section class="container" style="max-width: 560px;">
  <h2>Fale com a corretora</h2>
  <p>Preencha os dados abaixo. Você será redirecionado direto para o WhatsApp com a mensagem pronta.
     <em style="color:var(--cor-texto-suave); font-size:0.85rem;">(Nesta demo, o número é fictício: o WhatsApp pode abrir uma conversa vazia.)</em></p>
  <form id="form-contato">
    <p><label for="nome">Nome</label><input class="input" type="text" id="nome" name="nome" required></p>
    <p><label for="telefone">Telefone</label><input class="input" type="text" id="telefone" name="telefone" required></p>
    <p><label for="email">E-mail</label><input class="input" type="email" id="email" name="email"></p>
    <p><label for="mensagem">Mensagem</label><textarea class="input" id="mensagem" name="mensagem" rows="4"></textarea></p>
    <button type="submit" class="btn btn-whatsapp">Continuar no WhatsApp</button>
  </form>
</section>
</main>

<div id="footer-mount"></div>
<div id="social-float-mount"></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
  montarLayout({ ativo: 'contato' });

  const imovelId = new URLSearchParams(location.search).get('imovel');
  const imovelRelacionado = imovelId ? getImovel(imovelId) : null;

  document.getElementById('form-contato').addEventListener('submit', (e) => {
    e.preventDefault();
    const nome = document.getElementById('nome').value.trim();
    const telefone = document.getElementById('telefone').value.trim();
    const email = document.getElementById('email').value.trim();
    const mensagem = document.getElementById('mensagem').value.trim();
    if (!nome || !telefone) return;

    criarLead({ nome, telefone, email, mensagem, imovel_id: imovelRelacionado ? imovelRelacionado.id : null });

    const perfil = getPerfil();
    const partes = [`Olá, meu nome é ${nome}.`];
    if (imovelRelacionado) partes.push(`Tenho interesse no imóvel ${imovelRelacionado.codigo_referencia} (${imovelRelacionado.titulo}).`);
    if (mensagem) partes.push(mensagem);
    window.location.href = linkWhatsapp(perfil, partes.join(' '));
  });
</script>

</body>
</html>
