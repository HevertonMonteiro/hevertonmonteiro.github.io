<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1AA894">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Encanto Decorações">
<meta property="og:title" content="Encanto Decorações">
<meta property="og:description" content="Sistema de gestão de eventos e decoração.">
<meta property="og:image" content="https://encanto-decoracoes.vercel.app/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://encanto-decoracoes.vercel.app/assets/og-image.png">
<title>Cliente · Encanto Decorações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/app-shell.css">
<link rel="stylesheet" href="../css/clientes.css">
<link rel="stylesheet" href="../css/anexos.css">
<link rel="stylesheet" href="../css/demo.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebar-mount"></div>

  <div>
    <div id="topbar-mount"></div>

    <main class="app-main">
      <p style="margin-bottom: var(--sp-4)"><a href="./clientes.html">&larr; Voltar para Clientes</a></p>

      <div class="cliente-header">
        <div class="avatar-circle" id="cliente-avatar">?</div>
        <div class="cliente-header-info">
          <h1 id="cliente-nome" style="margin-bottom:2px">Carregando...</h1>
          <span id="cliente-contatos"></span>
        </div>
      </div>

      <div class="card" style="margin-bottom: var(--sp-6)" id="obs-card">
        <h3 class="card-title">Observações</h3>
        <p id="cliente-obs" style="margin:0">—</p>
      </div>

      <div class="tabs">
        <button class="tab-btn is-active" data-tab="eventos">Eventos</button>
        <button class="tab-btn" data-tab="financeiro">Financeiro</button>
        <button class="tab-btn" data-tab="contratos">Contratos</button>
        <button class="tab-btn" data-tab="arquivos">Arquivos</button>
      </div>

      <div class="tab-panel is-active" id="tab-eventos">
        <div class="card" style="padding:0"><div id="lista-eventos"></div></div>
      </div>

      <div class="tab-panel" id="tab-financeiro">
        <div class="card" style="padding:0"><div id="lista-financeiro"></div></div>
      </div>

      <div class="tab-panel" id="tab-contratos">
        <div class="card" style="padding:0"><div id="lista-contratos"></div></div>
      </div>

      <div class="tab-panel" id="tab-arquivos">
        <div class="card" style="padding:0"><div id="lista-arquivos"></div></div>
      </div>

    </main>
  </div>
</div>

<script type="module">
  import { protegerRota } from '../js/modules/route-guard.js';
  import { renderSidebar } from '../components/sidebar.js';
  import { renderTopbar } from '../components/topbar.js';
  import { showToast } from '../js/lib/toast.js';
  import {
    buscarClientePorId, historicoEventos, historicoFinanceiro, historicoContratos,
  } from '../js/modules/clientes.js';
  import { anexosDoCliente, urlAnexo } from '../js/modules/anexos.js';
  import { urlContrato } from '../js/modules/contratos.js';
  import { urlComprovante } from '../js/modules/financeiro.js';
  import { escapeHtml } from '../js/lib/sanitize.js';
  import { SITE_URL } from '../js/lib/config.js';

  await protegerRota();
  renderSidebar('clientes');
  renderTopbar();

  const params = new URLSearchParams(window.location.search);
  const clienteId = params.get('id');

  if (!clienteId) {
    window.location.href = './clientes.html';
  }

  const formatoMoeda = (v) => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const formatoData = (d) => new Date(d + 'T00:00:00').toLocaleDateString('pt-BR');

  const BADGE_STATUS = {
    orcamento: 'badge-orcamento', confirmado: 'badge-confirmado',
    concluido: 'badge-concluido', finalizado: 'badge-finalizado', cancelado: 'badge-cancelado',
  };
  const LABEL_STATUS = {
    orcamento: 'Orçamento', confirmado: 'Confirmado',
    concluido: 'Concluído', finalizado: 'Finalizado', cancelado: 'Cancelado',
  };
  const LABEL_FORMA_PAGAMENTO = {
    pix: 'PIX', cartao: 'Cartão', dinheiro: 'Dinheiro', transferencia: 'Transferência', boleto: 'Boleto',
  };

  async function carregarCabecalho() {
    const { data: cliente, error } = await buscarClientePorId(clienteId);
    if (error || !cliente) {
      showToast('Cliente não encontrado.', 'danger');
      window.location.href = './clientes.html';
      return;
    }
    document.getElementById('cliente-avatar').textContent = cliente.nome.charAt(0).toUpperCase();
    document.getElementById('cliente-nome').textContent = cliente.nome;
    document.getElementById('cliente-contatos').textContent =
      [cliente.whatsapp, cliente.instagram].filter(Boolean).join('  ·  ') || 'Sem contatos cadastrados';
    document.getElementById('cliente-obs').textContent = cliente.observacoes || 'Nenhuma observação registrada.';
  }

  async function carregarEventos() {
    const el = document.getElementById('lista-eventos');
    const { data } = await historicoEventos(clienteId);
    if (!data || !data.length) {
      el.innerHTML = `<div class="empty-state"><h3>Nenhum evento ainda</h3><p>Os eventos deste cliente aparecerão aqui.</p></div>`;
      return;
    }
    el.innerHTML = data.map(ev => `
      <div class="history-row" style="cursor:pointer" onclick="window.location.href='./evento-detalhe.html?id=${ev.id}'">
        <div class="history-row-main">
          <strong>${escapeHtml(ev.tipo_evento) || 'Evento'}${ev.tema ? ' · ' + escapeHtml(ev.tema) : ''}</strong>
          <span>${formatoData(ev.data)}${ev.horario ? ' às ' + ev.horario.slice(0,5) : ''}${ev.pacote ? ' · ' + ev.pacote : ''}</span>
        </div>
        <div style="display:flex; gap:var(--sp-2)">
          <span class="badge ${BADGE_STATUS[ev.status]}">${LABEL_STATUS[ev.status]}</span>
          <span class="badge badge-${ev.statusPagamento}">${ev.statusPagamento === 'quitado' ? 'Pago' : 'Pagamento pendente'}</span>
        </div>
      </div>
    `).join('');
  }

  async function carregarFinanceiro() {
    const el = document.getElementById('lista-financeiro');
    const { data } = await historicoFinanceiro(clienteId);
    if (!data || !data.length) {
      el.innerHTML = `<div class="empty-state"><h3>Nenhum pagamento ainda</h3><p>Os pagamentos recebidos aparecerão aqui.</p></div>`;
      return;
    }
    el.innerHTML = data.map(p => `
      <div class="history-row">
        <div class="history-row-main">
          <strong>${LABEL_FORMA_PAGAMENTO[p.forma_pagamento] || p.forma_pagamento}</strong>
          <span>${formatoData(p.data)}${p.eventos?.tipo_evento ? ' · ' + escapeHtml(p.eventos.tipo_evento) : ''}${p.observacao ? ' · ' + escapeHtml(p.observacao) : ''}</span>
        </div>
        <span class="history-row-value">${formatoMoeda(p.valor)}</span>
      </div>
    `).join('');
  }

  async function carregarContratos() {
    const el = document.getElementById('lista-contratos');
    const { data } = await historicoContratos(clienteId);
    if (!data || !data.length) {
      el.innerHTML = `<div class="empty-state"><h3>Nenhum contrato gerado</h3><p>Os contratos gerados para este cliente aparecerão aqui.</p></div>`;
      return;
    }
    // `arquivo_url` é só o caminho no Storage (bucket privado) — precisa
    // virar uma URL assinada antes de poder ser aberta, como já é feito em
    // carregarArquivos() logo abaixo. Sem isso, o link "Abrir" não funciona.
    el.innerHTML = (await Promise.all(data.map(async c => {
      const link = c.arquivo_url ? await urlContrato(c.arquivo_url) : null;
      const linkCurto = c.codigo_curto ? `${SITE_URL}/api/c/${c.codigo_curto}` : null;
      return `
      <div class="history-row">
        <div class="history-row-main">
          <strong>Contrato · ${escapeHtml(c.eventos?.tipo_evento) || 'Evento'}</strong>
          <span>Gerado em ${new Date(c.gerado_em).toLocaleDateString('pt-BR')}</span>
        </div>
        <div class="row-actions">
          ${link ? `<a class="btn btn-secondary btn-sm" href="${link}" target="_blank">Abrir</a>` : ''}
          ${linkCurto ? `<button class="btn btn-ghost btn-sm btn-copiar-link" data-link="${escapeHtml(linkCurto)}">Copiar link</button>` : ''}
        </div>
      </div>`;
    }))).join('');
  }

  const ICONE_FOTO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="m3 15 4.5-4.5a2 2 0 0 1 2.8 0L15 15m-1-2 1.6-1.6a2 2 0 0 1 2.8 0L21 14"/><circle cx="8" cy="8.5" r="1.4"/></svg>';
  const ICONE_DOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h8l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M15 3v4h4"/></svg>';

  async function carregarArquivos() {
    const el = document.getElementById('lista-arquivos');

    const [{ data: anexos }, { data: contratos }, { data: pagamentos }] = await Promise.all([
      anexosDoCliente(clienteId),
      historicoContratos(clienteId),
      historicoFinanceiro(clienteId),
    ]);

    const itens = [];

    (anexos || []).forEach(a => itens.push({
      tipo: a.categoria === 'foto' ? 'Foto' : 'Documento',
      icone: a.categoria === 'foto' ? ICONE_FOTO : ICONE_DOC,
      nome: a.nome_arquivo,
      data: a.created_at,
      getLink: () => urlAnexo(a.caminho),
    }));

    (contratos || []).forEach(c => c.arquivo_url && itens.push({
      tipo: 'Contrato',
      icone: ICONE_DOC,
      nome: `Contrato · ${c.eventos?.tipo_evento || 'Evento'}`,
      data: c.gerado_em,
      getLink: () => urlContrato(c.arquivo_url),
    }));

    (pagamentos || []).forEach(p => p.comprovante_url && itens.push({
      tipo: 'Comprovante',
      icone: ICONE_DOC,
      nome: `Comprovante · ${p.eventos?.tipo_evento || 'Evento'}`,
      data: p.data,
      getLink: () => urlComprovante(p.comprovante_url),
    }));

    if (!itens.length) {
      el.innerHTML = `<div class="empty-state"><h3>Nenhum arquivo ainda</h3><p>Anexos, contratos e comprovantes deste cliente aparecerão aqui.</p></div>`;
      return;
    }

    itens.sort((a, b) => new Date(b.data) - new Date(a.data));

    el.innerHTML = (await Promise.all(itens.map(async item => {
      const link = await item.getLink();
      return `
        <div class="anexo-row">
          <div class="anexo-icone">${item.icone}</div>
          <div class="anexo-row-main">
            <span class="arquivo-categoria-tag">${item.tipo}</span>
            <strong>${escapeHtml(item.nome)}</strong>
          </div>
          <a class="btn btn-secondary btn-sm" href="${link}" target="_blank">Abrir</a>
        </div>`;
    }))).join('');
  }

  document.getElementById('lista-contratos').addEventListener('click', (e) => {
    const btn = e.target.closest('.btn-copiar-link');
    if (!btn) return;
    navigator.clipboard.writeText(btn.dataset.link);
    const textoOriginal = btn.textContent;
    btn.textContent = 'Copiado!';
    setTimeout(() => { btn.textContent = textoOriginal; }, 2000);
  });

  // ---------- Tabs ----------
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('is-active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('is-active'));
      btn.classList.add('is-active');
      document.getElementById(`tab-${btn.dataset.tab}`).classList.add('is-active');
    });
  });

  carregarCabecalho();
  carregarEventos();
  carregarFinanceiro();
  carregarContratos();
  carregarArquivos();
</script>

</body>
</html>
