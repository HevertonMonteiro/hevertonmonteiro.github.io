<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1AA894">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Encanto Decorações">
<meta property="og:title" content="Encanto Decorações">
<meta property="og:description" content="Sistema de gestão de eventos e decoração.">
<meta property="og:image" content="https://encanto-decoracoes.vercel.app/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://encanto-decoracoes.vercel.app/assets/og-image.png">
<title>Roteiro do dia · Encanto Decorações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/app-shell.css">
<link rel="stylesheet" href="../css/producao.css">
<link rel="stylesheet" href="../css/demo.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebar-mount"></div>

  <div>
    <div id="topbar-mount"></div>

    <main class="app-main">
      <div class="page-header">
        <div>
          <h1>Roteiro do dia</h1>
          <p>Tudo que a equipe precisa saber para o dia de produção.</p>
        </div>
        <button class="btn btn-secondary" id="btn-imprimir">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>
          Imprimir
        </button>
      </div>

      <div class="roteiro-nav">
        <button class="period-nav-btn" id="btn-anterior" aria-label="Dia anterior">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <input class="input" type="date" id="roteiro-data" style="max-width:180px">
        <button class="period-nav-btn" id="btn-proximo" aria-label="Próximo dia">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="btn btn-secondary btn-sm" id="btn-hoje">Hoje</button>
      </div>

      <div id="roteiro-lista">Carregando...</div>
    </main>
  </div>
</div>

<!-- Modal: escolher app de navegação -->
<div class="modal-backdrop" id="modal-mapa" style="display:none">
  <div class="modal" style="max-width:340px">
    <div class="modal-header">
      <h3>Abrir endereço em...</h3>
      <button class="btn btn-ghost btn-icon" id="btn-fechar-modal-mapa" aria-label="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 6-12 12M6 6l12 12"/></svg>
      </button>
    </div>
    <div style="display:flex; flex-direction:column; gap: var(--sp-2)">
      <a class="btn btn-secondary btn-block" id="link-google-maps" target="_blank" rel="noopener">Google Maps</a>
      <a class="btn btn-secondary btn-block" id="link-waze" target="_blank" rel="noopener">Waze</a>
      <a class="btn btn-secondary btn-block" id="link-apple-maps" target="_blank" rel="noopener">Apple Maps</a>
    </div>
  </div>
</div>

<script type="module">
  import { protegerRota } from '../js/modules/route-guard.js';
  import { renderSidebar } from '../components/sidebar.js';
  import { renderTopbar } from '../components/topbar.js';
  import { eventosDoDia } from '../js/modules/eventos.js';
  import { escapeHtml } from '../js/lib/sanitize.js';

  await protegerRota();
  renderSidebar('producao');
  renderTopbar();

  const LABEL_STATUS = {
    orcamento: 'Orçamento', confirmado: 'Confirmado',
    concluido: 'Concluído', finalizado: 'Finalizado', cancelado: 'Cancelado',
  };

  function toISO(d) {
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function apenasNumeros(v) { return (v || '').replace(/\D/g, ''); }

  const inputData = document.getElementById('roteiro-data');
  let dataAtual = new Date();

  function icone(path) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${path}</svg>`;
  }
  const ICONE_MAPS = icone('<path d="M12 22s7-7.4 7-13a7 7 0 1 0-14 0c0 5.6 7 13 7 13Z"/><circle cx="12" cy="9" r="2.5"/>');
  const ICONE_WPP = icone('<path d="M20.5 3.5a10 10 0 0 0-16.9 10.4L2 22l8.3-1.6A10 10 0 1 0 20.5 3.5Z"/><path d="M8.5 8.7c.3-.7.6-.7.9-.7h.7c.2 0 .5 0 .7.5.3.6.9 2 1 2.1.1.2.1.4 0 .6-.2.3-.3.4-.5.6-.2.2-.4.4-.2.8.3.5 1.2 1.8 2.5 2.6 1 .6 1.5.7 1.8.6.3-.1.9-.6 1.1-.9.2-.3.4-.3.7-.2.3.1 2 1 2.4 1.2.4.2.6.3.7.5.1.2.1 1-.3 1.9-.4.9-2 1.6-2.8 1.6-.7 0-1.7-.1-4.5-1.5-3.4-1.8-5.4-5.6-5.6-5.9-.2-.3-1.3-1.8-1.3-3.4 0-1.6.8-2.4 1.1-2.7Z"/>');
  const ICONE_LIGAR = icone('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.5 2.1L8 9.7a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2Z"/>');
  const ICONE_OLHO = icone('<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>');

  async function carregar() {
    const iso = inputData.value;
    document.getElementById('roteiro-lista').innerHTML = `<div class="skeleton" style="height:120px;width:100%;border-radius:16px"></div>`;

    const { data: eventos } = await eventosDoDia(iso);

    if (!eventos || !eventos.length) {
      document.getElementById('roteiro-lista').innerHTML =
        `<div class="empty-state"><h3>Nenhum evento neste dia</h3><p>A produção está livre nesta data.</p></div>`;
      return;
    }

    document.getElementById('roteiro-lista').innerHTML = eventos.map(ev => {
      const cliente = ev.clientes || {};
      const telefone = cliente.whatsapp || '';
      const numeros = apenasNumeros(telefone);
      const wppUrl = numeros ? `https://wa.me/55${numeros}` : null;
      const ligarUrl = numeros ? `tel:${numeros}` : null;

      return `
        <div class="card roteiro-card">
          <div class="roteiro-hora">
            <div class="h">${ev.horario ? ev.horario.slice(0,5) : '—'}</div>
            <span class="badge badge-${ev.status}">${LABEL_STATUS[ev.status]}</span>
          </div>
          <div class="roteiro-body">
            <h3>${escapeHtml(cliente.nome) || 'Cliente'}</h3>
            <div class="subtitulo">${escapeHtml(ev.tipo_evento) || 'Evento'}${ev.tema ? ' · ' + escapeHtml(ev.tema) : ''}${ev.pacote ? ' · ' + escapeHtml(ev.pacote) : ''}</div>

            <div class="roteiro-info-grid">
              <div class="roteiro-info-item">
                <span class="label">Endereço</span>
                ${escapeHtml(ev.endereco) || 'Não informado'}
              </div>
              <div class="roteiro-info-item">
                <span class="label">Ponto de referência</span>
                ${escapeHtml(ev.ponto_referencia) || 'Não informado'}
              </div>
              <div class="roteiro-info-item">
                <span class="label">WhatsApp</span>
                ${escapeHtml(telefone) || 'Não informado'}
              </div>
              <div class="roteiro-info-item">
                <span class="label">Equipe</span>
                ${escapeHtml((ev.equipe_responsavel || []).join(', ')) || 'Não definida'}
              </div>
              ${ev.observacoes ? `
              <div class="roteiro-info-item" style="grid-column: 1 / -1">
                <span class="label">Observações</span>
                ${escapeHtml(ev.observacoes)}
              </div>` : ''}
            </div>

            <div class="roteiro-actions">
              ${ev.endereco ? `<button type="button" class="btn btn-secondary btn-sm btn-abrir-mapa" data-endereco="${escapeHtml(ev.endereco)}">${ICONE_MAPS}<span class="btn-text">Mapa</span></button>` : ''}
              ${wppUrl ? `<a class="btn btn-secondary btn-sm" href="${wppUrl}" target="_blank">${ICONE_WPP}<span class="btn-text">WhatsApp</span></a>` : ''}
              ${ligarUrl ? `<a class="btn btn-secondary btn-sm" href="${ligarUrl}">${ICONE_LIGAR}<span class="btn-text">Ligar</span></a>` : ''}
              <a class="btn btn-ghost btn-sm" href="./evento-detalhe.html?id=${ev.id}">${ICONE_OLHO}<span class="btn-text">Ver evento</span></a>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  inputData.addEventListener('change', carregar);
  document.getElementById('btn-anterior').addEventListener('click', () => {
    dataAtual = new Date(inputData.value + 'T00:00:00');
    dataAtual.setDate(dataAtual.getDate() - 1);
    inputData.value = toISO(dataAtual);
    carregar();
  });
  document.getElementById('btn-proximo').addEventListener('click', () => {
    dataAtual = new Date(inputData.value + 'T00:00:00');
    dataAtual.setDate(dataAtual.getDate() + 1);
    inputData.value = toISO(dataAtual);
    carregar();
  });
  document.getElementById('btn-hoje').addEventListener('click', () => {
    inputData.value = toISO(new Date());
    carregar();
  });

  document.getElementById('btn-imprimir').addEventListener('click', () => window.print());

  // ---------- Escolher app de navegação (Google Maps / Waze / Apple Maps) ----------
  const modalMapa = document.getElementById('modal-mapa');

  document.getElementById('roteiro-lista').addEventListener('click', (e) => {
    const btn = e.target.closest('.btn-abrir-mapa');
    if (!btn) return;
    const endereco = btn.dataset.endereco;
    const codificado = encodeURIComponent(endereco);

    document.getElementById('link-google-maps').href = `https://www.google.com/maps/search/?api=1&query=${codificado}`;
    document.getElementById('link-waze').href = `https://waze.com/ul?q=${codificado}&navigate=yes`;
    document.getElementById('link-apple-maps').href = `https://maps.apple.com/?q=${codificado}`;
    modalMapa.style.display = 'flex';
  });

  document.getElementById('btn-fechar-modal-mapa').addEventListener('click', () => { modalMapa.style.display = 'none'; });
  modalMapa.addEventListener('click', (e) => { if (e.target === modalMapa) modalMapa.style.display = 'none'; });

  inputData.value = toISO(new Date());
  carregar();
</script>

</body>
</html>
