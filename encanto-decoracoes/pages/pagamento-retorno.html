<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1AA894">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Encanto Decorações">
<meta property="og:title" content="Encanto Decorações">
<meta property="og:description" content="Sistema de gestão de eventos e decoração.">
<meta property="og:image" content="https://encanto-decoracoes.vercel.app/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://encanto-decoracoes.vercel.app/assets/og-image.png">
<title>Pagamento · Encanto Decorações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/demo.css">
</head>
<body>

<!-- Página pública — quem abre este link é o cliente pagando, nunca alguém
     logado no sistema, então esta tela NUNCA deve exigir login. -->
<div class="auth-screen">

  <aside class="auth-brand">
    <div class="auth-brand-logo">Encanto Decorações</div>
    <div class="auth-brand-quote">
      <p>Obrigado por confirmar seu pagamento com a gente.</p>
      <span>Sistema Operacional para Decoração de Festas</span>
    </div>
  </aside>

  <main class="auth-form-side">
    <div class="auth-form-box" style="text-align:center">
      <div class="logo-mark">Encanto Decorações</div>
      <div id="status-icone" class="pagamento-status-icone" style="margin: var(--sp-5) auto"></div>
      <h1 id="status-titulo">Processando...</h1>
      <p class="auth-subtitle" id="status-texto">Só um instante enquanto confirmamos seu pagamento.</p>
    </div>
  </main>

</div>

<script>
  const ICONES = {
    aprovado: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>',
    pendente: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 7v5l3 3"/></svg>',
    recusado: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>',
  };

  const TEXTOS = {
    aprovado: { titulo: 'Pagamento aprovado!', texto: 'Recebemos a confirmação. Muito obrigado, já pode fechar esta janela.' },
    pendente: { titulo: 'Pagamento em análise', texto: 'Assim que for aprovado, avisamos a equipe automaticamente. Você já pode fechar esta janela.' },
    recusado: { titulo: 'Pagamento não concluído', texto: 'Não foi possível confirmar o pagamento. Você pode tentar novamente pelo mesmo link ou falar com a equipe.' },
  };

  const params = new URLSearchParams(window.location.search);
  const status = params.get('collection_status') || params.get('status') || '';

  const chave = status === 'approved' ? 'aprovado'
    : status === 'in_process' || status === 'pending' ? 'pendente'
    : status === 'rejected' ? 'recusado'
    : 'pendente';

  document.getElementById('status-icone').innerHTML = ICONES[chave];
  document.getElementById('status-icone').classList.add(`is-${chave}`);
  document.getElementById('status-titulo').textContent = TEXTOS[chave].titulo;
  document.getElementById('status-texto').textContent = TEXTOS[chave].texto;
</script>

</body>
</html>
